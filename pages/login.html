<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooperative System</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-sm border-0 style-card" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <h3 class="text-center font-weight-bold mb-1">Cooperative System</h3>
      <p class="text-center text-muted small mb-4">Enter your credentials to Log In :</p>

      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username : </label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password : </label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
        
        <div class="d-flex justify-content-center">
          <button type="submit" id="loginBtn" class="btn btn-primary w-50 mt-2">Log In</button>
        </div>
      </form>
    </div>
  </div>
</div>

  <script src="js/login.js"></script>
</body>
</html>
